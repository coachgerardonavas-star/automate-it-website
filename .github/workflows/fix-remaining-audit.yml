name: Fix remaining audit findings

on:
  push:
    branches: [glasswing/astro7-cloudflare14]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Update remaining vulnerable dependencies') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glasswing/astro7-cloudflare14
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update Wrangler and safe transitive fixes
        run: |
          npm install --save-dev wrangler@4.131.1
          npm audit fix
      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit dependency lock updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update remaining vulnerable dependencies"
          git push origin HEAD:glasswing/astro7-cloudflare14
