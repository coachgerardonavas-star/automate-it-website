name: Fix typewriter TypeScript diagnostics

on:
  push:
    branches: [glasswing/astro7-cloudflare14]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix typewriter DOM types') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glasswing/astro7-cloudflare14
          fetch-depth: 0
      - name: Patch typewriter DOM types
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['src/components/Hero.astro','src/components/Home2026.astro']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('const cursor = container?.querySelector(".typewriter-cursor");','const cursor = container?.querySelector<HTMLElement>(".typewriter-cursor");')
              s=s.replace('const setCursor = (visible) => {','const setCursor = (visible: boolean) => {')
              p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Hero.astro src/components/Home2026.astro
          git commit -m "Fix typewriter DOM types"
          git push origin HEAD:glasswing/astro7-cloudflare14
