name: Glasswing CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: glasswing-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secure-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      # El sitio compilaba perfecto mientras servía trece enlaces internos
      # rotos. Astro no comprueba que una URL escrita a mano lleve a algún lado.
      - name: Check internal links
        run: npm run check:links
