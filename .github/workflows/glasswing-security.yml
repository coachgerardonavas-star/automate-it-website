name: Glasswing Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  worker-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed dotenv files
        shell: bash
        run: |
          bad=$(find . -type f -name '.env*' ! -name '.env.example' -not -path './.git/*')
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi
      - name: Reject obvious private key material
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='package-lock.json' 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk_live_[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}' .; then
            exit 1
          fi
      - name: Reject committed capability webhook URLs
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules 'https://hook\.[a-z0-9.-]*make\.com/[A-Za-z0-9]+' .; then
            exit 1
          fi

  worker-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - workers/stripe-checkout
          - workers/stripe-webhook
          - workers/diagnostico-intake
          - workers/consultoria-intake
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - name: Run worker tests when defined
        run: npm test --if-present
