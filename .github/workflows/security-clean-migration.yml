name: Security Clean Migration

on:
  push:
    branches:
      - security/dependency-remediation-2026-09-07

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rewrite dependency manifest to compatible secure versions
        shell: bash
        run: |
          npm pkg delete dependencies.@astrojs/tailwind
          npm pkg set dependencies.astro='7.3.1'
          npm pkg set dependencies.@astrojs/cloudflare='14.3.0'
          npm pkg set dependencies.@astrojs/markdoc='2.0.9'
          npm pkg set dependencies.@astrojs/react='6.0.5'
          npm pkg set dependencies.@astrojs/sitemap='3.7.4'
          npm pkg set dependencies.@keystatic/astro='6.0.0'
          npm pkg set dependencies.@keystatic/core='0.6.9'
          npm pkg set devDependencies.puppeteer='25.10.0'
          npm pkg set devDependencies.sharp='0.35.4'
          npm pkg set devDependencies.wrangler='^4.125.0'
          npm pkg set devDependencies.postcss='^8.5.6'
          npm pkg set devDependencies.autoprefixer='^10.4.21'
          npm pkg set engines.node='>=24'
          rm -rf node_modules package-lock.json
          npm install
      - name: Migrate Astro and Tailwind config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('astro.config.mjs')
          s=p.read_text()
          s=s.replace('import tailwind from "@astrojs/tailwind";\n','')
          s=s.replace('  output: "hybrid",','  output: "server",')
          s=s.replace('    tailwind({ applyBaseStyles: false }),\n','')
          p.write_text(s)
          Path('postcss.config.cjs').write_text("module.exports = { plugins: { tailwindcss: {}, autoprefixer: {} } };\n")
          PY
      - name: Build
        run: npm run build
      - name: Verify Pulso source is unchanged from main
        shell: bash
        run: |
          git fetch origin main
          if ! git diff --quiet origin/main -- src/pages/pulso src/lib/pulso scripts/pulso-audit.mjs; then
            echo "Pulso source differs from main during dependency migration"
            git diff -- origin/main -- src/pages/pulso src/lib/pulso scripts/pulso-audit.mjs
            exit 1
          fi
      - name: Verify current production Pulso baseline
        run: node scripts/pulso-audit.mjs https://yourbizupgraded.com
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Commit validated migration
        shell: bash
        run: |
          git config user.name "Automate IT Security Bot"
          git config user.email "automateit@yourbizupgraded.com"
          git add package.json package-lock.json astro.config.mjs postcss.config.cjs
          if git diff --cached --quiet; then
            echo "No dependency migration changes to commit"
            exit 0
          fi
          git commit -m "fix: migrate website to secure Astro dependency stack"
          git push origin HEAD:security/dependency-remediation-2026-09-07
