name: Security Major Remediation Trial

on:
  push:
    branches:
      - security/dependency-remediation-2026-09-07

permissions:
  contents: write

jobs:
  trial:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation-2026-09-07
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install current branch
        run: npm ci
      - name: Apply audit major-version fixes
        run: npm audit fix --force || true
      - name: Show dependency versions
        run: npm ls astro @astrojs/cloudflare @astrojs/markdoc @astrojs/react @astrojs/sitemap @astrojs/tailwind sharp puppeteer wrangler --depth=0 || true
      - name: Build after major remediation
        run: npm run build
      - name: Audit after major remediation
        run: npm audit --audit-level=moderate
      - name: Commit validated remediation
        shell: bash
        run: |
          git config user.name "Automate IT Security Bot"
          git config user.email "automateit@yourbizupgraded.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "fix: remediate remaining dependency vulnerabilities"
          git push origin HEAD:security/dependency-remediation-2026-09-07
