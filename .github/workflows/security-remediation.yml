name: Security Dependency Remediation

on:
  push:
    branches:
      - security/dependency-remediation-2026-09-07

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation-2026-09-07
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix || true
      - name: Build after fixes
        run: npm run build
      - name: Capture remaining audit
        run: npm audit --json > audit-after-safe-fix.json || true
      - name: Commit safe dependency updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package changes from npm audit fix"
            exit 0
          fi
          git config user.name "Automate IT Security Bot"
          git config user.email "automateit@yourbizupgraded.com"
          git add package.json package-lock.json
          git commit -m "fix: apply non-breaking dependency security updates"
          git push origin HEAD:security/dependency-remediation-2026-09-07
      - name: Print remaining high/moderate findings
        run: npm audit --audit-level=moderate || true
