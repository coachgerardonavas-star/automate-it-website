name: Security dependency remediation

on:
  push:
    branches: [chore/security-dependency-remediation]

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, 'Apply secure dependency updates') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: chore/security-dependency-remediation
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Upgrade Astro and Cloudflare adapter
        run: npm install --save-exact astro@7.3.2 @astrojs/cloudflare@14.3.1
      - name: Apply non-breaking audit fixes
        run: npm audit fix || true
      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "Apply secure dependency updates"
            git push origin HEAD:chore/security-dependency-remediation
          fi
      - name: Build with upgraded dependencies
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
