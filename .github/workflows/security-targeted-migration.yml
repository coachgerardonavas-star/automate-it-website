name: Security Targeted Migration

on:
  push:
    branches:
      - security/dependency-remediation-2026-09-07

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation-2026-09-07
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install compatible secure stack
        shell: bash
        run: |
          npm uninstall @astrojs/tailwind
          npm install astro@7.3.1 @astrojs/cloudflare@14.3.0 @astrojs/markdoc@2.0.9 @astrojs/react@6.0.5 @astrojs/sitemap@3.7.4 @keystatic/astro@6.0.0 @keystatic/core@0.6.9 puppeteer@25.10.0 sharp@0.35.4
          npm install -D wrangler@^4.125.0 postcss@^8.5.6 autoprefixer@^10.4.21
      - name: Migrate Astro and Tailwind config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('astro.config.mjs')
          s=p.read_text()
          s=s.replace('import tailwind from "@astrojs/tailwind";\n','')
          s=s.replace('  output: "hybrid",','  output: "server",')
          s=s.replace('    tailwind({ applyBaseStyles: false }),\n','')
          p.write_text(s)
          Path('postcss.config.cjs').write_text("module.exports = { plugins: { tailwindcss: {}, autoprefixer: {} } };\n")
          PY
      - name: Build
        run: npm run build
      - name: Pulso regression audit
        run: node scripts/pulso-audit.mjs
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Commit validated migration
        shell: bash
        run: |
          git config user.name "Automate IT Security Bot"
          git config user.email "automateit@yourbizupgraded.com"
          git add package.json package-lock.json astro.config.mjs postcss.config.cjs
          git commit -m "fix: migrate dependencies to secure Astro stack"
          git push origin HEAD:security/dependency-remediation-2026-09-07
