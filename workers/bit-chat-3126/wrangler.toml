name = "bit-chat-3126"
main = "secure-entry.js"
compatibility_date = "2026-05-20"
preview_urls = false

[vars]
ALLOWED_ORIGIN = "https://yourbizupgraded.com,http://localhost:4321,http://127.0.0.1:4321"

# Required for qualified-lead handoff; keep both values in Worker secrets:
#   wrangler secret put LEAD_WEBHOOK_URL
#   wrangler secret put MAKE_WEBHOOK_KEY

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "2003"
simple = { limit = 12, period = 60 }

[observability]
enabled = true
