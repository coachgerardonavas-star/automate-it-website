name = "bit-chat-3126"
main = "secure-entry.js"
compatibility_date = "2026-05-20"
preview_urls = false

[vars]
ALLOWED_ORIGIN = "https://yourbizupgraded.com,http://localhost:4321,http://127.0.0.1:4321"

# Public website chat: enough room for normal conversation while bounding
# Anthropic spend and scripted abuse. Each accepted request can use two model calls.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "2003"
simple = { limit = 12, period = 60 }

[observability]
enabled = true
