name = "consultoria-intake"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true

# Secrets (no van en este archivo):
#   wrangler secret put HUBSPOT_TOKEN       # private app token, pat-na1-*
#   wrangler secret put TELEGRAM_BOT_TOKEN  # el mismo bot que vero-telegram

[vars]
ALLOWED_ORIGINS = "https://yourbizupgraded.com,https://www.yourbizupgraded.com,http://localhost:4321"
TELEGRAM_CHAT_ID = "8348522203"
# Pipeline "WhatsApp Leads", etapa "Calificado".
DEAL_PIPELINE = "default"
DEAL_STAGE = "presentationscheduled"

# Rate limiter nativo de Cloudflare, por IP. Cierra el hueco que el filtro de
# Origin deja abierto a proposito (un cliente sin cabecera Origin lo pasa,
# porque las llamadas servidor-a-servidor tampoco la mandan).
#
# 5 envios por minuto y por IP, igual que diagnostico-intake. Cubre tambien la
# firma del acuerdo, que registra nombre, IP y timestamp como evidencia legal.
#
# namespace_id es un identificador local del worker, distinto en cada uno.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
