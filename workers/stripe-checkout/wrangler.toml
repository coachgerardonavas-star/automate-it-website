name = "stripe-checkout-automate"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true

# Set STRIPE_SECRET_KEY (sk_test_* in sandbox, sk_live_* in production):
#   wrangler secret put STRIPE_SECRET_KEY
#
# Optional override of allowed origins (comma-separated). Defaults to the
# production + Cloudflare Pages preview origins listed in src/index.ts.
#   wrangler secret put ALLOWED_ORIGINS

# Glasswing: checkout-session creation consumes a third-party resource and must
# be protected from scripted bursts. Ten attempts/minute/IP leaves room for real
# retries while bounding abuse and accidental loops.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
